<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>TP4 JS (Part 2) - Etape 6 : Suppression des lignes sélectionnées & Fonctionnalités avancées</title>
    <!-- Liaison de la feuille de style CSS externe -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="table_container">

        <div id="form_container">
            <div class="form_group">
                <label class="form_label">Nom:</label>
                <input type="text" id="form_nom" class="form_field"/>
            </div>
            <div class="form_group">
                <label class="form_label">Prénom:</label>
                <input type="text" id="form_prenom" class="form_field"/>
            </div>
            <div class="form_group">
                <label class="form_label">Points:</label>
                <input type="number" id="form_points" class="form_field"/>
            </div>
            <!-- Ici on attache un événement au clic onclick appelant doNewData() (slides 21, 129 et 133) -->
            <button class="btn-add" onclick="doNewData()">Ajouter</button>
        </div>

        <!-- [FONCTIONNALITÉ OPTIONNELLE 1] Barre de recherche / Filtrage en direct -->
        <div id="search_container">
            <label for="search_input" class="search_label">Rechercher :</label>
            <input type="text" id="search_input" class="form_field" placeholder="Filtrer en direct par nom..." onkeyup="filterTable()"/>
        </div>

        <table>
            <thead>
                <tr>
                    <th class="col_number">N°</th>
                    <th class="col_text">Nom</th>
                    <th class="col_text">Prénom</th>
                    <th class="col_number">Points</th>
                    <!-- [FONCTIONNALITÉ OPTIONNELLE 2] Tout cocher / Tout décocher via la checkbox d'en-tête -->
                    <th class="col_chkbox">
                        Select
                        <input type="checkbox" id="check_all" title="Tout cocher / Tout décocher" onclick="toggleSelectAll()"/>
                    </th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <div id="container_summary">
            <p id="p1">0 ligne(s)</p>
            <p id="p2"></p>
            <p id="p3">Totale point(s)= 0</p>
        </div>

        <div id="container_btn">
            <!-- [FONCTIONNALITÉ OPTIONNELLE 3] Bouton de Tri des lignes par Points -->
            <!-- Ici on attache un événement onclick appelant sortRowsByPoints() (slides 21, 129 et 133) -->
            <button class="btn-sort" onclick="sortRowsByPoints()">Trier par Points ⬍</button>
            <button class="btn-consol" onclick="consoleTableau()">Console Tableau</button>
            <button class="btn-del" onclick="deleteRow()">Supprimer</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
